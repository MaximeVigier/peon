[project]
name = "peon"
version = "0.1.0"
description = "Agent oriente evenements, modulaire et independant du modele utilise."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Maxime" },
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
peon = "peon.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
